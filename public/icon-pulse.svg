<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <radialGradient id="pulse-flare" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#4AFFB4" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#4A8FFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFB44A" stop-opacity="0" />
    </radialGradient>
    <filter id="pulse-blur" x="0" y="0" width="32" height="32" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pulse Radial Aura -->
  <circle cx="16" cy="16" r="14" fill="url(#pulse-flare)" filter="url(#pulse-blur)" opacity="0.6" />

  <!-- HexPrism Geometry with High Luminescence -->
  <path d="M4 9.33 L16 16 L16 29.33 L4 22.67 Z" fill="#1E293B" stroke="#4AFFB4" stroke-opacity="0.8" stroke-width="1.4" stroke-linejoin="round" />
  <path d="M16 16 L28 9.33 L28 22.67 L16 29.33 Z" fill="#4AFFB4" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4" stroke-linejoin="round" />
  <path d="M16 2.67 L28 9.33 L16 16 L4 9.33 Z" fill="#FFFFFF" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" />
  <path d="M16 2.67 L16 16 M4 9.33 L16 16 M28 9.33 L16 16 M16 16 L16 29.33" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Overdriven Center Core -->
  <path d="M16 11 L21 16 L16 21 L11 16 Z" fill="#FFFFFF" stroke="#4AFFB4" stroke-width="1.2" />
</svg>
