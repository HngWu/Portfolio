<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="top-specular-qp" x1="16" y1="2" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="obsidian-shade-qp" x1="4" y1="9" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gold-energy-qp" x1="16" y1="16" x2="28" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD280" />
      <stop offset="100%" stop-color="#FFB44A" />
    </linearGradient>
    <filter id="core-glow-qp" x="8" y="8" width="16" height="16" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Facet: Obsidian Shade -->
  <path d="M4 9.33 L16 16 L16 29.33 L4 22.67 Z" fill="url(#obsidian-shade-qp)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Right Facet: Solar Gold Energy -->
  <path d="M16 16 L28 9.33 L28 22.67 L16 29.33 Z" fill="url(#gold-energy-qp)" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Top Facet: Specular Reflection -->
  <path d="M16 2.67 L28 9.33 L16 16 L4 9.33 Z" fill="url(#top-specular-qp)" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Inner Seam Lines -->
  <path d="M16 2.67 L16 16 M4 9.33 L16 16 M28 9.33 L16 16 M16 16 L16 29.33" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Nexus Core (Solar Gold Flare) -->
  <path d="M16 12.5 L19.5 16 L16 19.5 L12.5 16 Z" fill="#FFB44A" filter="url(#core-glow-qp)" stroke="#FFFFFF" stroke-width="0.8" />
</svg>
