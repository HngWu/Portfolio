<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- To The Point (TTP) Tech Dark Rounded Square -->
  <rect width="100" height="100" rx="20" fill="#0c1222" stroke="rgba(74,255,180,0.3)" stroke-width="2" />
  <!-- Precision Target Reticle & Point Motif -->
  <circle cx="50" cy="42" r="24" stroke="#4affb4" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="50" cy="42" r="14" stroke="#6affff" stroke-width="2" opacity="0.9" />
  <circle cx="50" cy="42" r="5" fill="#4affb4" />
  <!-- TTP Acronym -->
  <text x="50" y="84" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" letter-spacing="2">TTP</text>
</svg>
